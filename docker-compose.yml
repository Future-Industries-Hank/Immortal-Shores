services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: immortal
      POSTGRES_PASSWORD: immortal
      POSTGRES_DB: immortal_shores
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immortal -d immortal_shores"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
